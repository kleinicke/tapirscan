[package]
name = "tapirscan-package-source"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
syn = { version = "=2.0.119", default-features = false, features = ["parsing"] }

[package]
name = "tapirscan"
version = "1.3.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Florian Nick"]
description = "Barcode scanning with source-image geometry and reusable Rust scanners"
repository = "https://github.com/kleinicke/tapirscan"
homepage = "https://tapirscan.f-kleinicke.de"
readme = "README.md"
keywords = ["barcode", "scanner", "ean", "qrcode", "image"]
categories = ["multimedia::images", "computer-vision"]
include = ["api/**", "generated/**", "tests/**", "examples/**", "LICENSE", "README.md", "provenance.json", "build.rs"]
autoexamples = true

[lib]
path = "api/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
encoding_rs = "0.8.35"
image = { version = "0.25.10", default-features = false, optional = true }

[features]
default = ["image", "mode-low", "mode-medium", "mode-high", "mode-very-high"]
image = ["dep:image"]

# Each mode feature adds one effort mode, so features from different dependents
# only ever combine. For a smaller build, disable default features and list modes.
mode-low = []
mode-medium = []
mode-high = []
mode-very-high = []

<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Tapirscan camera example</title>
  <button id="start">Start camera</button>
  <button id="stop" disabled>Stop</button>
  <video style="max-width: 100%"></video>
  <pre role="status"></pre>
  <script type="module">
    // Serve this package directory and open /examples/camera.html on localhost.
    import { Scanner } from "../dist/browser-medium.js";
    import { CameraScanner } from "../dist/camera.js";
    const status = document.querySelector("pre");
    const start = document.querySelector("#start");
    const stop = document.querySelector("#stop");
    const scanner = new Scanner({ formats: ["EAN13", "QRCode"] });
    const camera = new CameraScanner(document.querySelector("video"), scanner, {
      onScan: (result) => (status.textContent = JSON.stringify(result.values)),
      onError: (error) => shutdown(error.message),
    });

    function shutdown(message = "") {
      camera.stop();
      status.textContent = message;
      start.disabled = false;
      stop.disabled = true;
    }

    start.onclick = async () => {
      start.disabled = true;
      stop.disabled = false;
      await camera.start().catch((error) => shutdown(error.message));
    };
    stop.onclick = () => shutdown();
  </script>
</html>

<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Tapirscan camera example</title>
  <button id="start">Start camera</button>
  <button id="stop" disabled>Stop</button>
  <video autoplay muted playsinline style="max-width: 100%"></video>
  <pre role="status"></pre>
  <script type="module">
    // Serve this package directory and open /examples/camera.html on localhost.
    import { Scanner } from "../dist/browser.js";
    const video = document.querySelector("video");
    const status = document.querySelector("pre");
    const start = document.querySelector("#start");
    const stop = document.querySelector("#stop");
    let scanner;
    let stream;

    function shutdown() {
      scanner?.dispose();
      stream?.getTracks().forEach((track) => track.stop());
      scanner = stream = video.srcObject = undefined;
      start.disabled = false;
      stop.disabled = true;
    }
    function fail(error) {
      status.textContent = error.message;
      shutdown();
    }

    start.onclick = async () => {
      start.disabled = true;
      // Loads in a worker while the camera starts.
      scanner = new Scanner({ formats: ["EAN13", "QRCode"] });
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
        });
      } catch (error) {
        return fail(error);
      }
      video.srcObject = stream;
      stop.disabled = false;
      scanner.watch(
        video,
        (barcodes) => (status.textContent = JSON.stringify(barcodes.map((b) => b.text))),
        fail,
      );
    };
    stop.onclick = shutdown;
    window.addEventListener("pagehide", shutdown);
  </script>
</html>

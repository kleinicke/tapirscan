name: tapirscan
version: 1.5.0
description: Dart and Flutter binding of the Tapirscan barcode scanner through dart:ffi.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ">=1.1.0 <3.0.0" # 1.x for apps whose other hooks still use it
  ffi: ^2.2.0
  hooks: ">=2.0.0 <3.0.0" # 2.0 for Flutter 3.44, which pins meta 1.18

dev_dependencies:
  ffigen: ^23.0.0
  image: ^4.12.0
  lints: ^6.1.0
  test: ^1.33.0

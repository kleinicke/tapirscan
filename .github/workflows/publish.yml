name: Prepare or publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version already set in the package manifests (e.g. 1.3.0)
        required: true
        type: string
      publish:
        description: Registry to publish to (none only prepares reviewed artifacts)
        default: none
        type: choice
        options: [none, pypi, npm, crates, pub, all]
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate release identity before building
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/check_release.mjs
          python3 scripts/release_tag.py check
      - name: Require the release tag for pub.dev, which rejects runs on branches
        if: inputs.publish == 'pub'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/v$RELEASE_VERSION" ]; then
            echo "::error::Publishing to pub.dev needs a run on tag v$RELEASE_VERSION, not $GITHUB_REF"
            exit 1
          fi
  validation:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  wheels:
    needs: preflight
    uses: ./.github/workflows/wheels.yml
  prepare:
    needs: [validation, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: packages-ubuntu-24.04
          path: build/release-input/CI_RUN
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: build/release-input/WHEELS_RUN
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/release-input/NATIVE_RUN
      - name: Validate packages from this run's successful builds
        run: |
          python scripts/test_release_artifacts.py
          python scripts/test_release_tag.py
          node scripts/check_release.mjs
          python scripts/collect_release.py
      - run: python -m pip install twine
      - run: python -m twine check build/release/wheels/*.whl
      - name: Verify npm install from the packed artifact
        run: |
          mkdir -p build/release-install
          npm install --prefix build/release-install --ignore-scripts ./build/release/npm/tapirscan-*.tgz
          node --input-type=module -e 'const api = await import("./build/release-install/node_modules/tapirscan/dist/index.js"); if (typeof api.scan !== "function") throw Error("Missing scan API")'
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: build/release/
          if-no-files-found: error
      - name: Show the bundle to review
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Release $RELEASE_VERSION"
            echo "Commit: $GITHUB_SHA"
            echo "Download release-bundle from this run before approving release."
            echo '```'
            cat build/release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  approve:
    needs: prepare
    if: inputs.publish != 'none'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - name: Verify the approved bundle
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Tag the tested commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release_tag.py create
  github-release:
    needs: approve
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      - name: Attach the native libraries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        # Assets are immutable per version: the Dart package ships their
        # checksums. A later run for another registry keeps the attached set.
        run: |
          tag="v$RELEASE_VERSION"
          cd release/native
          assets=(*)
          if ! gh release view "$tag" > /dev/null 2>&1; then
            awk -v heading="## $RELEASE_VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
              "$GITHUB_WORKSPACE/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --verify-tag --title "Tapirscan $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" "${assets[@]}"
            exit 0
          fi
          attached=$(gh release view "$tag" --json assets --jq '.assets[].name')
          missing=()
          for asset in "${assets[@]}"; do
            grep -qxF "$asset" <<< "$attached" || missing+=("$asset")
          done
          if [ "${#missing[@]}" -eq "${#assets[@]}" ]; then
            gh release upload "$tag" "${assets[@]}"
          elif [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Release $tag has only some native assets; delete them and rerun: ${missing[*]} missing"
            exit 1
          else
            echo "Release $tag already has the native assets; keeping them"
          fi
  pypi:
    needs: approve
    if: inputs.publish == 'pypi' || inputs.publish == 'all'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/wheels/
  npm:
    needs: approve
    if: inputs.publish == 'npm' || inputs.publish == 'all'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      - run: npm publish release/npm/tapirscan-*.tgz --access public
  crates:
    needs: approve
    if: inputs.publish == 'crates' || inputs.publish == 'all'
    runs-on: ubuntu-24.04
    environment: crates
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: rust-toolchain.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      - name: Install the Rust compiler from rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the reviewed crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Unpack outside the checkout: inside it, cargo inspects the sparse
        # partial clone and fails on blobs it does not have.
        run: |
          crate="$RUNNER_TEMP/crate"
          mkdir "$crate"
          tar -xzf release/crates/tapirscan-*.crate -C "$crate" --strip-components 1
          cargo publish --locked --manifest-path "$crate/Cargo.toml"
  pub:
    needs: github-release
    if: inputs.publish == 'pub'
    runs-on: ubuntu-24.04
    environment: pub
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.7"
      - name: Ship the attached assets' checksums for the build hook to verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          assets="$RUNNER_TEMP/assets"
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          (cd "$assets" && sha256sum --check --strict SHA256SUMS)
          cp "$assets/SHA256SUMS" bindings/flutter/hook/SHA256SUMS
      - name: Publish the package with its checksums
        working-directory: bindings/flutter
        run: |
          dart pub get
          dart pub publish --force

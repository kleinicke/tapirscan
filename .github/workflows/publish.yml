name: Prepare or publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version already set in the package manifests (e.g. 1.3.0)
        required: true
        type: string
      publish:
        description: Registry to publish to (none only prepares reviewed artifacts)
        default: none
        type: choice
        options: [none, pypi, npm, crates, all]
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate release identity before building
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/check_release.mjs
          python3 scripts/release_tag.py check
  validation:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  wheels:
    needs: preflight
    uses: ./.github/workflows/wheels.yml
  prepare:
    needs: [validation, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: packages-ubuntu-24.04
          path: build/release-input/CI_RUN
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: build/release-input/WHEELS_RUN
      - name: Validate packages from this run's successful builds
        run: |
          python scripts/test_release_artifacts.py
          python scripts/test_release_tag.py
          node scripts/check_release.mjs
          python scripts/collect_release.py
      - run: python -m pip install twine
      - run: python -m twine check build/release/wheels/*.whl
      - name: Verify npm install from the packed artifact
        run: |
          mkdir -p build/release-install
          npm install --prefix build/release-install --ignore-scripts ./build/release/npm/tapirscan-*.tgz
          node --input-type=module -e 'const api = await import("./build/release-install/node_modules/tapirscan/dist/index.js"); if (typeof api.scan !== "function") throw Error("Missing scan API")'
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: build/release/
          if-no-files-found: error
      - name: Show the bundle to review
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Release $RELEASE_VERSION"
            echo "Commit: $GITHUB_SHA"
            echo "Download release-bundle from this run before approving release."
            echo '```'
            cat build/release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  approve:
    needs: prepare
    if: inputs.publish != 'none'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - name: Verify the approved bundle
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Tag the tested commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release_tag.py create
  pypi:
    needs: approve
    if: inputs.publish == 'pypi' || inputs.publish == 'all'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/wheels/
  npm:
    needs: approve
    if: inputs.publish == 'npm' || inputs.publish == 'all'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      - run: npm publish release/npm/tapirscan-*.tgz --access public
  crates:
    needs: approve
    if: inputs.publish == 'crates' || inputs.publish == 'all'
    runs-on: ubuntu-24.04
    environment: crates
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - run: cd release && sha256sum --check SHA256SUMS
      - run: rustup toolchain install 1.91.1 --profile minimal
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the reviewed crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          mkdir crate
          tar -xzf release/crates/tapirscan-*.crate -C crate --strip-components 1
          cargo +1.91.1 publish --locked --manifest-path crate/Cargo.toml

name: Build Python release wheels
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    name: Wheel / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # platform names the native release asset (scripts/collect_release.py).
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Expose Git's patch command on Windows
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
      - name: Install the Rust compiler from rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - run: cargo fetch --locked --manifest-path multiformat/Cargo.toml
      - run: cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
      - name: Fetch maintained core dependencies
        run: cargo fetch --locked --manifest-path core/Cargo.toml
      - run: python scripts/verify_sources.py
      - run: python scripts/build_native.py
      - run: python -m pip install build twine
      - name: Build and check wheel metadata
        run: |
          python -m build --wheel --outdir build/wheels bindings/python
          python -m twine check build/wheels/*.whl
      - name: Decode using the installed bundle in an isolated environment
        run: for wheel in build/wheels/*.whl; do python scripts/test_installed_wheel.py "$wheel"; done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: build/wheels/*.whl
          if-no-files-found: error
      - name: Keep the wheel's library and the Windows import library for the release
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native/
          if-no-files-found: error
  linux:
    name: Wheel / manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            platform: linux-x64
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set Python and Rust paths
        run: |
          echo /opt/python/cp310-cp310/bin >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the Rust compiler from rust-toolchain.toml
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - run: cargo fetch --locked --manifest-path multiformat/Cargo.toml
      - run: cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
      - name: Fetch maintained core dependencies
        run: cargo fetch --locked --manifest-path core/Cargo.toml
      - run: python scripts/verify_sources.py
      - run: python scripts/build_native.py
      - run: python -m pip install build twine auditwheel
      - name: Build portable Linux wheels
        run: |
          python -m build --wheel --outdir build/wheels bindings/python
          auditwheel repair --plat manylinux_2_28_${{ matrix.arch }} --wheel-dir build/repaired build/wheels/*.whl
          python -m twine check build/repaired/*.whl
      - name: Decode using the repaired installed bundle
        run: for wheel in build/repaired/*.whl; do python scripts/test_installed_wheel.py "$wheel"; done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux_2_28-${{ matrix.arch }}
          path: build/repaired/*.whl
          if-no-files-found: error
      - name: Keep the wheel's library for the release
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native/
          if-no-files-found: error

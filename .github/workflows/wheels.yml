name: Build Python release wheels
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  desktop:
    name: Wheel / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # platform names the native release asset (scripts/collect_release.py).
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2022
            platform: windows-x64
          # GitHub's Python builds for Windows on ARM64 start at 3.11.
          - os: windows-11-arm
            platform: windows-arm64
            python: "3.11"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python || '3.10' }}
      - name: Expose Git's patch command on Windows
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
      - name: Build with an ARM64 Python and Rust host on Windows on ARM
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          python -c 'import sysconfig; p = sysconfig.get_platform(); assert p == "win-arm64", p'
          rustup set default-host aarch64-pc-windows-msvc
      - name: Install the Rust compiler from rust-toolchain.toml
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - run: cargo fetch --locked --manifest-path multiformat/Cargo.toml
      - run: cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
      - name: Fetch maintained core dependencies
        run: cargo fetch --locked --manifest-path core/Cargo.toml
      - run: python scripts/verify_sources.py
      - run: python scripts/build_native.py
      - run: python -m pip install build twine
      - name: Build and check wheel metadata
        run: |
          python -m build --wheel --outdir build/wheels bindings/python
          python -m twine check build/wheels/*.whl
      - name: Decode using the installed bundle in an isolated environment
        run: for wheel in build/wheels/*.whl; do python scripts/test_installed_wheel.py "$wheel"; done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: build/wheels/*.whl
          if-no-files-found: error
      - name: Keep the wheel's library and the Windows import library for the release
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native/
          if-no-files-found: error
  linux:
    name: Wheel / ${{ matrix.libc }}_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            libc: manylinux_2_28
            arch: x86_64
            platform: linux-x64
          - os: ubuntu-24.04-arm
            libc: manylinux_2_28
            arch: aarch64
            platform: linux-arm64
          # Alpine and other musl distributions.
          - os: ubuntu-24.04
            libc: musllinux_1_2
            arch: x86_64
            platform: linux-x64-musl
          - os: ubuntu-24.04-arm
            libc: musllinux_1_2
            arch: aarch64
            platform: linux-arm64-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # GitHub's JavaScript actions cannot run in Alpine containers on ARM64
      # runners, so only the build runs in the manylinux or musllinux image.
      - name: Build, repair and test the wheel in the ${{ matrix.libc }} image
        env:
          IMAGE: quay.io/pypa/${{ matrix.libc }}_${{ matrix.arch }}
          PLAT: ${{ matrix.libc }}_${{ matrix.arch }}
          # Rust's musl targets link statically by default, which cannot build the
          # shared library; link musl dynamically like the glibc build.
          RUSTFLAGS: ${{ startsWith(matrix.libc, 'musllinux') && '-C target-feature=-crt-static' || '' }}
        run: |
          docker run --rm -i -v "$PWD:/io" -w /io -e PLAT -e RUSTFLAGS -e PYTHONUTF8=1 "$IMAGE" sh -eux <<'EOF'
          export PATH="/opt/python/cp310-cp310/bin:$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          cargo fetch --locked --manifest-path multiformat/Cargo.toml
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
          cargo fetch --locked --manifest-path core/Cargo.toml
          python scripts/verify_sources.py
          python scripts/build_native.py
          python -m pip install build twine auditwheel
          python -m build --wheel --outdir build/wheels bindings/python
          auditwheel repair --plat "$PLAT" --wheel-dir build/repaired build/wheels/*.whl
          python -m twine check build/repaired/*.whl
          for wheel in build/repaired/*.whl; do python scripts/test_installed_wheel.py "$wheel"; done
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.libc }}-${{ matrix.arch }}
          path: build/repaired/*.whl
          if-no-files-found: error
      - name: Keep the wheel's library for the release
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native/
          if-no-files-found: error

[package]
name = "barcode-multiformat"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
encoding_rs = "=0.8.35"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["ffi"]
ffi = []
